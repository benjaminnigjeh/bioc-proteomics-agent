name: Release

# Continuous delivery: publishes the Docker image to Docker Hub, but only
# on deliberate version tags (vX.Y.Z), never on ordinary commits to main.
# This never deploys the app anywhere -- it only makes the image available
# for someone to `docker pull` and run on their own localhost, consistent
# with this project's localhost-only design.
#
# Requires two repository secrets (Settings -> Secrets and variables ->
# Actions): DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (a Docker Hub access
# token, not your account password). See WORKSHOP_DEMO.md / README.md.

on:
  push:
    tags:
      - "v*.*.*"

env:
  LLM_MODE: mock

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4"

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libnetcdf-dev libxml2-dev libssl-dev libcurl4-openssl-dev zlib1g-dev libglpk-dev

      - name: Cache R library
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-libs-${{ runner.os }}-${{ hashFiles('scripts/install_packages.R') }}
          restore-keys: r-libs-${{ runner.os }}-

      - name: Restore / install R dependencies
        run: Rscript scripts/install_packages.R

      - name: Generate demo data
        run: Rscript scripts/generate_demo_data.R

      - name: Run unit tests (mock LLM mode -- no paid API calls)
        run: LLM_MODE=mock Rscript -e "testthat::test_dir('tests/testthat', stop_on_failure = TRUE)"

  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build image (local load for smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: bioc-proteomics-agent:smoke-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test -- boot the built image and verify localhost:3838
        run: |
          cp .env.example .env
          sed -i 's/^LLM_MODE=.*/LLM_MODE=mock/' .env
          docker run -d --name smoke-test --env-file .env -p 127.0.0.1:3838:3838 bioc-proteomics-agent:smoke-test
          for i in $(seq 1 30); do
            status=$(docker inspect --format='{{.State.Health.Status}}' smoke-test 2>/dev/null || echo starting)
            if [ "$status" = "healthy" ]; then echo "Container is healthy."; break; fi
            sleep 5
          done
          curl -fsS http://127.0.0.1:3838/ > /dev/null
          docker logs smoke-test
          docker rm -f smoke-test

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push versioned + latest tags
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/bioc-proteomics-agent:${{ steps.version.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/bioc-proteomics-agent:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
